<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: full-bleed background, icon scaled/centered inside the
       ~80% "safe zone" circle (radius ~205px from center) so OS masks
       (circle, squircle, rounded square) never clip the glyph. -->
  <rect width="512" height="512" fill="#F6F7F9" />

  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <circle
      cx="256" cy="256" r="176"
      fill="none"
      stroke="#127A52"
      stroke-width="34"
      stroke-linecap="round"
      stroke-dasharray="760 1200"
      stroke-dashoffset="0"
      transform="rotate(-90 256 256)"
    />
    <line x1="256" y1="256" x2="256" y2="146" stroke="#127A52" stroke-width="26" stroke-linecap="round" />
    <line x1="256" y1="256" x2="336" y2="256" stroke="#127A52" stroke-width="26" stroke-linecap="round" />
    <path
      d="M 322 388 L 358 424 L 434 340"
      fill="none"
      stroke="#127A52"
      stroke-width="30"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
